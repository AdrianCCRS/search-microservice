_format_version: "3.0"
_transform: true

services:
  # Frontend: nginx sirve estáticos y proxy /api/search a search-api
  - name: frontend-service
    url: http://frontend:80
    routes:
      - name: frontend-route
        methods: [GET]
        paths:
          - /

  # API Search protegida con JWT para consumidores externos.
  # Para desarrollo/demo, el frontend usa nginx como proxy sin JWT.
  # Descomentar las rutas de abajo cuando se quiera exponer la API
  # con autenticación JWT a clientes externos.
  # - name: search-service
  #   url: http://search-api:8080
  #   routes:
  #     - name: search-route
  #       methods: [GET]
  #       paths:
  #         - /api/search
  #     - name: suggest-route
  #       methods: [GET]
  #       paths:
  #         - /api/search/suggest
  #   plugins:
  #     - name: jwt
  #       config:
  #         key_claim_name: iss
  #         claims_to_verify:
  #           - exp
  #         run_on_preflight: true

consumers:
  - username: keycloak-issuer
    jwt_secrets:
      - key: "http://localhost:8081/realms/ecommerce"
        algorithm: RS256
        # FASE 2: Reemplazar este placeholder por la clave real obtenida de:
        # curl http://localhost:8081/realms/ecommerce/protocol/openid-connect/certs
        # y convertirla con: https://8gwifi.org/jwkconvertfunctions.jsp
        # NOTA: Este PEM dummy es sintacticamente valido para que Kong arranque sin errores.
        # Mientras la clave sea dummy, Kong arrancara pero rechazara todos los tokens (401).
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxzSMM2CzjIyPHTaUIEg4
          78JPvOOl/7p6oVZZMolBSGdxfbZf5TMU2CQH9lqZegSRed1e0hAXQjv0oCr4Xn5H
          x+mwH5gK/017ePuL6zeY8gvJtDa7ZkA1M5UW7MSwfbSNTwQE9GAQvaWBcmLtRoDg
          FuOOHE0E6V9bRDiKTG/trQq880XCghJO1sH7qf+2riw6Zg04YGeHPrc7613D3I9I
          5WU1DYedC/LXMgO9UBG2S4KKKw4Lh3aFm2fZEqNhVVhKacKrs+sSm8cZklAtHivn
          nhoG5FnS5HMGdHe6+4Yu7BDkXsUNc8L/iu9Ji5RvJuDJI3KwSOpYw13JPf/oNDsP
          wwIDAQAB
          -----END PUBLIC KEY-----
        secret: "unused-for-rs256"
