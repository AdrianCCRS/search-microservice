_format_version: "3.0"
_transform: true

services:
  - name: search-service
    url: http://search-api:8080
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
      # 1. Dejamos la limitación por IP ligada a nivel de todo el servicio
      - name: rate-limiting
        config:
          minute: 60
          limit_by: ip
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: search-route
        methods: [GET]
        paths:
          - /api/search
        # 2. Movemos la limitación por Consumidor de forma independiente a la ruta de búsqueda
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: suggest-route
        methods: [GET]
        paths:
          - /api/search/suggest
        # 3. Hacemos lo mismo para la ruta de sugerencias
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false

consumers:
  - username: keycloak-issuer
    jwt_secrets:
      - key: "http://localhost:8081/realms/ecommerce"
        algorithm: RS256
        # FASE 2: Reemplazar este placeholder por la clave real obtenida de:
        # curl http://localhost:8081/realms/ecommerce/protocol/openid-connect/certs
