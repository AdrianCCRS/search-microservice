_format_version: "2.1"

services:
  - name: frontend-service
    url: http://frontend:80
    routes:
      - name: frontend-route
        methods: [GET]
        paths:
          - /

  - name: search-service
    url: http://search-api:8080
    plugins:
      # - name: jwt
      #   config:
      #     key_claim_name: iss
      #     claims_to_verify:
      #       - exp
      #     run_on_preflight: true
      - name: rate-limiting
        config:
          minute: 60
          limit_by: ip
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: search-route
        methods: [GET]
        paths:
          - /api/search
        strip_path: false # <--- ¡Añade esto aquí!
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: suggest-route
        methods: [GET]
        paths:
          - /api/search/suggest
        strip_path: false # <--- ¡Añade esto aquí también!
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false

  - name: catalog-service
    url: http://catalog_api:5290
    routes:
      - name: catalog-api-route
        methods: [GET, POST, PUT, PATCH, DELETE]
        paths:
          - /api/v1/catalog
        strip_path: false
      - name: catalog-images-route
        methods: [GET]
        paths:
          - /images
        strip_path: false
      - name: catalog-health-route
        methods: [GET]
        paths:
          - /health
        strip_path: false

  - name: catalog-frontend-service
    url: http://catalog_frontend:80
    routes:
      - name: catalog-frontend-route
        methods: [GET]
        paths:
          - /catalog
        strip_path: true

  - name: cart-service
    url: http://cart_api:8000
    routes:
      - name: cart-routes
        methods: [GET, POST, PUT, DELETE]
        paths:
          - /api/cart
        strip_path: false

