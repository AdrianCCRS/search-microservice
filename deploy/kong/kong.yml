_format_version: "3.0"
_transform: true

services:
  - name: search-service
    url: http://search-api:8080
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
      - name: rate-limiting
        config:
          minute: 60
          limit_by: ip
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: search-route
        methods: [GET]
        paths:
          - /api/search
        strip_path: false # <--- ¡Añade esto aquí!
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: suggest-route
        methods: [GET]
        paths:
          - /api/search/suggest
        strip_path: false # <--- ¡Añade esto aquí también!
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false

consumers:
  - username: keycloak-issuer
    jwt_secrets:
