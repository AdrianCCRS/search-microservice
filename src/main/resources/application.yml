spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/search_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secure_pass_123}
      timeout: ${REDIS_TIMEOUT:2s}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5000
          multiplier: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: search-microservice

search:
  cache:
    redis:
      product-key-prefix: ${SEARCH_CACHE_PRODUCT_KEY_PREFIX:search:product:}
      query-key-pattern: ${SEARCH_CACHE_QUERY_KEY_PATTERN:search:query:*}
      suggest-key-pattern: ${SEARCH_CACHE_SUGGEST_KEY_PATTERN:search:suggest:*}
      scan-count: ${SEARCH_CACHE_SCAN_COUNT:1000}
      search-ttl: ${SEARCH_CACHE_SEARCH_TTL:1m}
      suggest-ttl: ${SEARCH_CACHE_SUGGEST_TTL:5m}

es:
  index:
    name: products
    shards: ${ES_NUMBER_OF_SHARDS:1}
    replicas: ${ES_NUMBER_OF_REPLICAS:0}