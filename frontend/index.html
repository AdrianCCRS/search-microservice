<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Microservice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1 class="header-title">Buscador de Productos</h1>
    <p class="header-subtitle">Search Microservice — Read Model CQRS</p>
  </header>

  <main class="main">
    <div class="search-container">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Buscar productos..."
          autocomplete="off"
        />
        <button id="searchBtn" class="search-btn">Buscar</button>
      </div>
      <ul id="suggestions" class="suggestions hidden"></ul>
    </div>

    <div id="status" class="status hidden"></div>
    <div id="results" class="results"></div>
  </main>

  <footer class="footer">
    <span>API: <code id="apiUrl"></code></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
